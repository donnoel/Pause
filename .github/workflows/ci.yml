name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Ensure the iOS platform (simulators) is installed for this Xcode
      - name: Install iOS platform
        run: |
          sudo xcodebuild -downloadPlatform iOS

      # Optional but speeds things up a lot: cache SwiftPM artifacts
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: spm-${{ runner.os }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Pause.xcodeproj

      # Build + test on a known-available iOS simulator
      - name: Build and test
        run: |
          set -e
          xcodebuild \
            -project Pause.xcodeproj \
            -scheme Pause \
            -destination "platform=iOS Simulator,OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            clean test

      - name: Upload xcodebuild logs (if the job fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ~/Library/Logs/scan
